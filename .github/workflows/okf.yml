name: OKF wiki

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: okf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate the OKF bundle and relative links
        run: python scripts/validate_okf.py
      - name: Run validator self-test
        run: python scripts/validate_okf.py --self-test
      - name: Attest the dome-diameter computation
        run: python wiki/references/attesters/feet-to-meters.py
      - name: Attest the pilot-budget computation
        run: python wiki/references/attesters/pilot-budget.py
      - name: Build the knowledge-graph site
        run: python scripts/build_site.py --base /cville-ecodome/ --out dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install site dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Build the knowledge-graph site
        run: python scripts/build_site.py --base /cville-ecodome/ --out dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
