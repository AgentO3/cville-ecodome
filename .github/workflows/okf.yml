name: OKF wiki

on:
  push:
  pull_request:

permissions:
  contents: read

# Do not cancel an in-progress Pages deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Upload and deploy must be separate jobs. deploy-pages reads the
  # github-pages artifact only after the uploading job has finished.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate the OKF bundle and relative links
        run: python scripts/validate_okf.py
      - name: Run validator self-test
        run: python scripts/validate_okf.py --self-test
      - name: Attest the dome-diameter computation
        run: python wiki/references/attesters/feet-to-meters.py
      - name: Attest the pilot-budget computation
        run: python wiki/references/attesters/pilot-budget.py
      - name: Build the knowledge-graph site
        run: python scripts/build_site.py --base /cville-ecodome/ --out dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
